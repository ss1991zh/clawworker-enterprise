[project]
name = "agent-system"
version = "1.7.0"
description = "Multi-user encrypted-data analytics agent with local homomorphic encryption"
requires-python = ">=3.11"
authors = [{ name = "agent-system" }]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
]
host = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "PyMySQL>=1.1.1",
    "psycopg[binary]>=3.2.0",
    "pyodbc>=5.2.0",
    "sqlglot>=27.0.0",
]
client = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "Jinja2>=3.1",
    "python-multipart>=0.0.20",
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "croniter>=6.0",
    "python-docx>=1.1",
    "pypdf>=5.0",
]

[project.scripts]
agent-client = "client.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "host*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
